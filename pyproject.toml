[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "project_empathy"
version = "0.2.0"
description = "SaaS de réceptionniste IA pour restaurants"
readme = "README.md"
authors = [{name = "Project Empathy"}]
license = {file = "LICENSE"}
requires-python = ">=3.10"
dependencies = [
    "fastapi==0.111.0",
    "uvicorn[standard]==0.30.1",
    "sqlalchemy==2.0.30",
    "psycopg2-binary==2.9.9",
    "pydantic==2.7.1",
    "pydantic-settings==2.2.1",
    "python-dotenv==1.0.1",
    "openai==0.28.1",
    "twilio==9.1.1",
    "httpx==0.27.0",
    "python-multipart==0.0.9"
]

[project.optional-dependencies]
dev = ["pytest==8.2.2"]

[tool.setuptools.packages.find]
where = ["src"]
