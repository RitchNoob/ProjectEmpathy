version: "3.9"

services:
  db:
    image: postgres:15
    environment:
      POSTGRES_DB: empathy
      POSTGRES_USER: empathy
      POSTGRES_PASSWORD: empathy
    ports:
      - "5432:5432"
    volumes:
      - empathy-db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U empathy"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build: .
    environment:
      EMP_DATABASE__URL: postgresql+psycopg2://empathy:empathy@db:5432/empathy
      EMP_ALLOWED_ORIGINS: '["http://localhost:5173","http://127.0.0.1:5173","http://frontend:5173"]'
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - api-data:/data
    ports:
      - "8000:8000"
    command: >
      sh -c "python scripts/init_db.py --seed-demo && uvicorn project_empathy.main:app --host 0.0.0.0 --port 8000"

  frontend:
    build:
      context: ./frontend
    environment:
      VITE_BACKEND_URL: http://api:8000
    depends_on:
      - api
    ports:
      - "5173:5173"
    command: ["npm", "run", "dev", "--", "--host", "0.0.0.0", "--port", "5173"]

volumes:
  empathy-db:
  api-data:
