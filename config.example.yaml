# Example configuration for Project Empathy backend

application:
  debug: true
  secret_key: "change-me"
  allowed_origins:
    - "http://localhost:5173"

  database:
    url: "sqlite:///./empathy.db"
    echo: false

  twilio:
    account_sid: "ACxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxx"
    auth_token: "your_twilio_token"
    voice_phone_number: "+33123456789"
    status_callback_url: "https://example.com/api/v1/twilio/status"

  openai:
    api_key: "sk-..."
    model: "gpt-4o-mini"
    request_timeout: 60

  flexprice:
    base_url: "https://api.flexprice.io"
    api_key: "flexprice_api_key"
    product_id: "prod_xxx"

  storage:
    data_dir: "data"
    transcripts_dir: "data/transcripts"

  notifications:
    enabled: true
    delivery_timeout: 10
    signature_header: "X-ProjectEmpathy-Signature"
    event_header: "X-ProjectEmpathy-Event"
